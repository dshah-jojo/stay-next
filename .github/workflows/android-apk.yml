name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk STAY-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STAY-debug.apk
          path: STAY-debug.apk

      # Keep the latest APK on a dedicated branch so it can be fetched over git.
      - name: Publish APK to apk branch
        run: |
          mkdir /tmp/apkbranch && cd /tmp/apkbranch
          git init -b apk
          cp "$GITHUB_WORKSPACE/STAY-debug.apk" .
          echo "Latest STAY debug APK · built from ${GITHUB_SHA} · $(date -u +%Y-%m-%dT%H:%MZ)" > README.md
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "APK build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      # And attach it to a rolling release for easy download on a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: STAY · latest APK
          prerelease: true
          files: STAY-debug.apk
